
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <title>Nuevo seguro</title>
</head>
<body>
<main>
    <div class="container px-4 py-5">
        <h1 class="pb-2 mb-3 border-bottom">Nuevo Seguro</h1>
        <form method="post" th:action="@{/sede/save}" class="mt-2">
            <div class="mb-3">
                <label for="empresa_aseguradora" class="form-label">empresa_aseguradora</label>
                <input type="text" class="form-control" name="empresa_aseguradora" id="empresa_aseguradora">
            </div>

            <div class="mb-3">
                <label for="cobertura_maxima" class="form-label">cobertura_maxima</label>
                <input type="text" class="form-control" name="cobertura_maxima" id="cobertura_maxima">
            </div>

            <div class="mb-3">
                <label for="tarifa" class="form-label">tarifa</label>
                <input type="text" class="form-control" name="tarifa" id="tarifa">
            </div>


            <a th:href="@{/seguro}" class="btn btn-danger">Cancelar</a>
            <button type="submit" class="btn btn-primary">Registrar</button>
        </form>
    </div>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
